# KrishiAI YOLO26 Detection Baseline Configuration
# Model: yolo26n.pt
# Dataset: data/final/detection/data.yaml (10 classes: 7 Basil + 3 Mint)

task: detect
model: models/pretrained/yolo26n.pt
data: data/final/detection/data.yaml
epochs: 50
batch: 16
imgsz: 640
device: auto
workers: 4
patience: 10
save: true
save_period: -1
cache: false
exist_ok: true
pretrained: true
optimizer: auto
verbose: true
seed: 42
deterministic: true
single_cls: false
rect: false
cos_lr: true
close_mosaic: 10
resume: false
amp: true
fraction: 1.0
profile: false
freeze: null

# Hyperparameters
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5
pose: 12.0
kobj: 1.0
label_smoothing: 0.0
nbs: 64
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
bgr: 0.0
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
auto_augment: randaugment
erasing: 0.4
crop_fraction: 1.0

# Project & Experiment Tracking
project: experiments/detection
name: krishiai_yolo26_det_baseline
