# KrishiAI YOLO26 Classification Baseline Configuration
# Model: yolo26n-cls.pt
# Dataset: data/final/classification/ (5 classes: Aloe Vera)

task: classify
model: models/pretrained/yolo26n-cls.pt
data: data/final/classification
epochs: 50
batch: 32
imgsz: 224
device: auto
workers: 4
patience: 10
save: true
save_period: -1
cache: false
exist_ok: true
pretrained: true
optimizer: auto
verbose: true
seed: 42
deterministic: true
cos_lr: true
resume: false
amp: true
fraction: 1.0

# Hyperparameters
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
label_smoothing: 0.1
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 10.0
translate: 0.1
scale: 0.5
shear: 0.0
flipud: 0.0
fliplr: 0.5
auto_augment: randaugment
erasing: 0.4
crop_fraction: 1.0

# Project & Experiment Tracking
project: experiments/classification
name: krishiai_yolo26_cls_baseline
