services:
  - type: web
    name: krishiai
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir "opencv-python-headless>=4.8.0" && pip install --no-cache-dir -r requirements.txt && pip install --no-cache-dir -e .
    startCommand: uvicorn krishiai.api.app:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 65
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: src
      - key: MODEL_DEVICE
        value: cpu
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics


